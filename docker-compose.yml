version: "3.9"

services:

  postgres:
    image: postgres:15
    container_name: todo-postgres

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: tododb

    ports:
      - "5432:5432"

    volumes:
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql